
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>멍냥지도 | 반려동물 동반 장소 찾기</title>

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=41a46ce230457ef8074be30843244b99&libraries=services&autoload=false"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      background: #fffaf3;
      color: #514238;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .sidebar {
      width: 370px;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      background: #fffaf3;
      border-right: 2px solid #eadbc9;
      z-index: 2;
    }

    .header {
      padding: 25px 22px 18px;
      background: #f5e6d4;
    }

    .logo {
      font-size: 27px;
      font-weight: 900;
      color: #79553b;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 7px;
      font-size: 13px;
      color: #8d7562;
      line-height: 1.6;
    }

    .pet-decoration {
      margin-top: 10px;
      font-size: 23px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 15px 18px 5px;
    }

    .tab {
      flex: 1;
      padding: 12px 8px;
      border: 0;
      border-radius: 14px;
      background: #f1e6d9;
      color: #866d58;
      font-weight: 800;
    }

    .tab.active {
      background: #8b674b;
      color: white;
      box-shadow: 0 3px 7px #8b674b25;
    }

    .search-area {
      padding: 12px 18px 14px;
    }

    .search-label {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .search-row {
      display: flex;
      gap: 7px;
    }

    #searchInput {
      min-width: 0;
      flex: 1;
      padding: 13px 12px;
      border: 2px solid #e6d6c4;
      border-radius: 13px;
      outline: none;
      background: white;
      color: #514238;
    }

    #searchInput:focus {
      border-color: #a98461;
    }

    #searchButton {
      border: 0;
      border-radius: 13px;
      padding: 0 15px;
      background: #8b674b;
      color: white;
      font-weight: 800;
    }

    #locationButton {
      width: 100%;
      margin-top: 9px;
      padding: 10px;
      border: 1px solid #e5d3bf;
      border-radius: 12px;
      background: white;
      color: #79553b;
      font-weight: 700;
    }

    .hint {
      margin-top: 9px;
      font-size: 11px;
      line-height: 1.6;
      color: #9b8775;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      border-top: 1px solid #f0e4d7;
      border-bottom: 1px solid #f0e4d7;
      font-size: 13px;
      font-weight: 800;
    }

    #resultCount {
      color: #9b7553;
    }

    #placeList {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .place-card {
      padding: 15px;
      margin-bottom: 10px;
      border: 1px solid #eddfd0;
      border-radius: 16px;
      background: white;
      cursor: pointer;
      transition: 0.15s;
    }

    .place-card:hover {
      border-color: #b99674;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px #79553b10;
    }

    .place-name {
      font-size: 15px;
      font-weight: 900;
      line-height: 1.5;
      color: #604630;
    }

    .place-category {
      display: inline-block;
      margin: 7px 0;
      padding: 4px 8px;
      border-radius: 8px;
      background: #f8eee2;
      color: #956b47;
      font-size: 11px;
      font-weight: 800;
    }

    .place-address {
      font-size: 12px;
      line-height: 1.6;
      color: #89796c;
      overflow-wrap: anywhere;
    }

    .empty {
      padding: 32px 15px;
      text-align: center;
      color: #9a8878;
      font-size: 13px;
      line-height: 1.8;
    }

    .footer {
      padding: 10px;
      text-align: center;
      font-size: 11px;
      color: #a08c79;
      background: #f8eee2;
    }

    #map {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: #eee8de;
    }

    /* 강아지 이모지 마커 */
    .dog-marker {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 40px;
      height: 40px;
      border: 2px solid #b99674;
      border-radius: 50%;
      background: #fffaf3;
      box-shadow: 0 2px 7px #60463035;
      font-size: 25px;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .dog-marker:hover {
      transform: scale(1.18);
    }

    .info-window {
      padding: 12px;
      min-width: 190px;
      max-width: 250px;
      font-family: sans-serif;
      color: #514238;
      line-height: 1.6;
      overflow-wrap: anywhere;
      background: white;
      border-radius: 10px;
    }

    .info-title {
      font-weight: 900;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .info-detail {
      font-size: 12px;
      color: #76695d;
    }

    @media (max-width: 700px) {
      .app {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        min-width: 0;
        height: 53%;
        flex: none;
        border-right: 0;
        border-bottom: 2px solid #eadbc9;
      }

      .header {
        padding: 13px 16px 10px;
      }

      .logo {
        font-size: 22px;
      }

      .pet-decoration {
        display: none;
      }

      .tabs {
        padding: 9px 12px 2px;
      }

      .search-area {
        padding: 8px 12px 10px;
      }

      .results-header {
        padding: 8px 14px;
      }

      #placeList {
        padding: 8px 10px;
      }

      .place-card {
        padding: 11px;
        margin-bottom: 7px;
      }

      .footer {
        display: none;
      }

      #map {
        width: 100%;
        min-height: 150px;
        flex: 1;
      }
    }
  </style>
</head>

<body>
<div class="app">
  <aside class="sidebar">

    <header class="header">
      <div class="logo">🐾 멍냥지도</div>
      <div class="subtitle">
        우리 아이와 함께하는 즐거운 외출!<br>
        반려동물 동반 장소를 찾아보세요.
      </div>
      <div class="pet-decoration">🐶 🐱 🐾</div>
    </header>

    <div class="tabs">
      <button class="tab active" data-category="카페">☕ 카페</button>
      <button class="tab" data-category="식당">🍽️ 음식점</button>
    </div>

    <section class="search-area">
      <div class="search-label">🔎 찾고 싶은 매장 이름</div>

      <div class="search-row">
        <input
          id="searchInput"
          type="search"
          placeholder="매장 이름만 검색할 수 있어요"
          autocomplete="off"
        >
        <button id="searchButton">검색</button>
      </div>

      <button id="locationButton">📍 내 위치로 이동</button>

      <div class="hint">
        매장 이름으로 검색해 보세요!<br>
        CSV에 등록된 카페와 음식점을 표시해요. 🐾
      </div>
    </section>

    <div class="results-header">
      <span>🐾 검색 결과</span>
      <span id="resultCount">불러오는 중...</span>
    </div>

    <div id="placeList">
      <div class="empty">장소 데이터를 불러오고 있어요... 🐾</div>
    </div>

    <div class="footer">멍냥지도 · 반려동물과 함께하는 하루 🧡</div>
  </aside>

  <main id="map"></main>
</div>

<script>
  // index.html과 places.csv는 같은 폴더에 있어야 합니다.
  const CSV_FILE = "./places.csv";

  let map;
  let places = [];
  let markers = [];
  let infoWindow;
  let selectedCategory = "카페";
  let currentResults = [];

  // 열 이름이 달라도 공백 차이를 무시하고 찾습니다.
  function normalize(value) {
    return String(value ?? "")
      .toLowerCase()
      .replace(/\s+/g, "")
      .trim();
  }

  function getField(row, candidates) {
    const keys = Object.keys(row || {});

    for (const candidate of candidates) {
      const found = keys.find(
        key => normalize(key) === normalize(candidate)
      );

      if (found && row[found] != null) {
        return String(row[found]).trim();
      }
    }

    return "";
  }

  // CSV 한 행을 장소 데이터로 변환합니다.
  function toPlace(row, index) {
    const name = getField(row, [
      "시설명",
      "업소명",
      "장소명",
      "매장명",
      "상호명",
      "사업장명",
      "name"
    ]);

    const category = getField(row, [
      "카테고리3",
      "카테고리2",
      "카테고리1",
      "업종",
      "업태명",
      "업종명",
      "업태",
      "카테고리",
      "분류",
      "category"
    ]);

    const lat = Number(getField(row, [
      "위도", "lat", "latitude"
    ]));

    const lng = Number(getField(row, [
      "경도", "lon", "lng", "longitude"
    ]));

    return {
      id: index,
      name,
      category,
      lat,
      lng,
      roadAddress: getField(row, [
        "도로명주소",
        "도로명 주소",
        "도로명전체주소",
        "roadAddress"
      ]),
      address: getField(row, [
        "지번주소",
        "지번 주소",
        "주소",
        "소재지주소",
        "address"
      ]),
      phone: getField(row, [
        "전화번호",
        "연락처",
        "전화"
      ]),
      raw: row
    };
  }

  // 카페 또는 음식점인지 판별합니다.
  // CSV의 여러 업종 열을 함께 확인해 누락을 줄입니다.
  function matchesCategory(place) {
    const categoryText = normalize([
      place.category,
      getField(place.raw, [
        "카테고리1",
        "카테고리2",
        "카테고리3",
        "업종",
        "업종명",
        "업태",
        "업태명",
        "분류"
      ])
    ].join(" "));

    if (selectedCategory === "카페") {
      return (
        categoryText.includes("카페") ||
        categoryText.includes("커피") ||
        categoryText.includes("휴게음식점") &&
        (
          categoryText.includes("커피") ||
          categoryText.includes("다방")
        )
      );
    }

    const restaurantKeywords = [
      "음식점",
      "식당",
      "일반음식점",
      "휴게음식점",
      "식품접객업",
      "레스토랑",
      "한식",
      "중식",
      "일식",
      "양식",
      "분식",
      "패스트푸드",
      "치킨",
      "피자",
      "햄버거",
      "고기",
      "구이",
      "횟집",
      "초밥",
      "국수",
      "국밥",
      "탕",
      "찜",
      "뷔페",
      "돈까스",
      "족발",
      "보쌈",
      "샤브",
      "마라",
      "쌀국수",
      "패밀리레스토랑"
    ];

    return restaurantKeywords.some(keyword =>
      categoryText.includes(normalize(keyword))
    );
  }

  // 검색 대상은 오직 매장명입니다.
  function matchesSearch(place, query) {
    if (!query) return true;

    return normalize(place.name).includes(normalize(query));
  }

  function initMap() {
    const container = document.getElementById("map");

    map = new kakao.maps.Map(container, {
      center: new kakao.maps.LatLng(36.5, 127.8),
      level: 13
    });

    infoWindow = new kakao.maps.InfoWindow({
      zIndex: 10
    });

    loadCSV();
  }

  // CSV의 모든 행을 읽고 유효한 좌표가 있는 장소를 보관합니다.
  // 반려동물 동반 여부 값이 특정 문자로 기록되어 있어야 한다는
  // 조건은 두지 않아 데이터가 불필요하게 누락되는 것을 방지합니다.
  function loadCSV() {
    Papa.parse(CSV_FILE, {
      download: true,
      header: true,
      skipEmptyLines: true,

      complete: function(results) {
        if (results.errors && results.errors.length) {
          console.warn("CSV 읽기 경고:", results.errors);
        }

        places = results.data
          .map((row, index) => toPlace(row, index))
          .filter(place =>
            place.name &&
            Number.isFinite(place.lat) &&
            Number.isFinite(place.lng) &&
            place.lat !== 0 &&
            place.lng !== 0 &&
            place.lat >= -90 &&
            place.lat <= 90 &&
            place.lng >= -180 &&
            place.lng <= 180
          );

        if (places.length === 0) {
          document.getElementById("placeList").innerHTML =
            '<div class="empty">표시할 장소가 없어요.<br>CSV의 시설명과 위도·경도 열을 확인해 주세요.</div>';

          document.getElementById("resultCount").textContent = "0곳";
          return;
        }

        // 처음부터 현재 탭의 모든 장소를 찾아 지도에 표시합니다.
        renderResults(true);
      },

      error: function(error) {
        console.error("CSV 불러오기 오류:", error);

        document.getElementById("placeList").innerHTML =
          '<div class="empty">CSV 파일을 불러오지 못했어요.<br>index.html과 places.csv가 같은 폴더에 있는지 확인해 주세요.</div>';

        document.getElementById("resultCount").textContent = "오류";
      }
    });
  }

  // 거리 제한, 결과 개수 제한을 적용하지 않습니다.
  function renderResults(fitMap = false) {
    const query = document.getElementById("searchInput").value.trim();

    const results = places
      .filter(place => matchesCategory(place))
      .filter(place => matchesSearch(place, query));

    currentResults = results;

    renderList(results);
    renderMarkers(results, fitMap);
  }

  function renderList(results) {
    const list = document.getElementById("placeList");

    document.getElementById("resultCount").textContent =
      results.length + "곳";

    if (results.length === 0) {
      list.innerHTML = `
        <div class="empty">
          🐾 검색 결과가 없어요!<br><br>
          매장 이름을 확인하거나<br>
          다른 카테고리를 선택해 보세요.
        </div>
      `;
      return;
    }

    list.innerHTML = "";

    results.forEach(place => {
      const card = document.createElement("div");
      card.className = "place-card";

      const name = document.createElement("div");
      name.className = "place-name";
      name.textContent =
        (selectedCategory === "카페" ? "☕ " : "🍽️ ") +
        place.name;

      const category = document.createElement("span");
      category.className = "place-category";
      category.textContent = place.category || selectedCategory;

      const address = document.createElement("div");
      address.className = "place-address";
      address.textContent =
        "📍 " +
        (place.roadAddress || place.address || "주소 정보 없음");

      card.append(name, category, address);

      card.addEventListener("click", () => {
        const position = new kakao.maps.LatLng(place.lat, place.lng);

        map.setCenter(position);
        map.setLevel(3);

        showPlaceInfo(place);
      });

      list.appendChild(card);
    });
  }

  function clearMarkers() {
    markers.forEach(marker => marker.setMap(null));
    markers = [];

    if (infoWindow) {
      infoWindow.close();
    }
  }

  // 검색 결과에 해당하는 모든 장소에 강아지 마커를 만듭니다.
  function renderMarkers(results, fitMap = false) {
    clearMarkers();

    if (results.length === 0) {
      return;
    }

    const bounds = new kakao.maps.LatLngBounds();

    results.forEach(place => {
      const position = new kakao.maps.LatLng(
        place.lat,
        place.lng
      );

      bounds.extend(position);

      const markerContent = document.createElement("div");
      markerContent.className = "dog-marker";
      markerContent.textContent = "🐶";
      markerContent.title = place.name;
      markerContent.setAttribute("role", "button");
      markerContent.setAttribute(
        "aria-label",
        place.name + " 상세 정보"
      );

      const marker = new kakao.maps.CustomOverlay({
        position: position,
        content: markerContent,
        yAnchor: 1,
        zIndex: 5
      });

      marker.setMap(map);

      markerContent.addEventListener("click", () => {
        showPlaceInfo(place);
      });

      markers.push(marker);
    });

    // 처음 불러오기, 탭 변경, 검색 버튼 클릭 시
    // 결과에 해당하는 장소들이 지도 범위에 들어오도록 합니다.
    if (fitMap) {
      if (results.length === 1) {
        map.setCenter(
          new kakao.maps.LatLng(results[0].lat, results[0].lng)
        );
        map.setLevel(5);
      } else {
        map.setBounds(bounds, 60);
      }
    }
  }

  function showPlaceInfo(place) {
    const content = document.createElement("div");
    content.className = "info-window";

    const title = document.createElement("div");
    title.className = "info-title";
    title.textContent = "🐾 " + place.name;

    const category = document.createElement("div");
    category.className = "info-detail";
    category.textContent = place.category || selectedCategory;

    const address = document.createElement("div");
    address.className = "info-detail";
    address.textContent =
      "📍 " +
      (place.roadAddress || place.address || "주소 정보 없음");

    content.append(title, category, address);

    if (place.phone) {
      const phone = document.createElement("div");
      phone.className = "info-detail";
      phone.textContent = "☎ " + place.phone;
      content.appendChild(phone);
    }

    infoWindow.setContent(content);
    infoWindow.setPosition(
      new kakao.maps.LatLng(place.lat, place.lng)
    );
    infoWindow.open(map);
  }

  // 카페 / 음식점 탭
  document.querySelectorAll(".tab").forEach(button => {
    button.addEventListener("click", () => {
      selectedCategory = button.dataset.category;

      document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.toggle("active", tab === button);
      });

      renderResults(true);
    });
  });

  // 검색 버튼을 누르면 매장명으로 검색하고 지도 범위도 조정합니다.
  document.getElementById("searchButton")
    .addEventListener("click", () => {
      renderResults(true);
    });

  // 엔터 키 검색
  document.getElementById("searchInput")
    .addEventListener("keydown", event => {
      if (event.key === "Enter") {
        renderResults(true);
      }
    });

  // 입력 중에는 목록과 마커만 갱신합니다.
  document.getElementById("searchInput")
    .addEventListener("input", () => {
      renderResults(false);
    });

  // 현재 위치로 이동
  document.getElementById("locationButton")
    .addEventListener("click", () => {
      if (!navigator.geolocation) {
        alert("이 브라우저에서는 위치 기능을 사용할 수 없어요.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        position => {
          const center = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );

          map.setCenter(center);
          map.setLevel(5);
        },

        () => {
          alert(
            "위치를 가져오지 못했어요. 브라우저의 위치 권한을 확인해 주세요."
          );
        }
      );
    });

  kakao.maps.load(initMap);
</script>
</body>
</html>
