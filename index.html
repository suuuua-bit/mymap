
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반려동물 동반 매장 지도</title>

  <!-- 카카오 지도 SDK -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=41a46ce230457ef8074be30843244b99&libraries=services&autoload=false"></script>

  <!-- CSV 파일 읽기 -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #333;
    }

    header {
      padding: 16px;
      background: #fff4e8;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    .search-area {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    input, select, button {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    input {
      flex: 1;
      min-width: 150px;
    }

    button {
      cursor: pointer;
      background: white;
    }

    #searchButton {
      background: #60452e;
      color: white;
      border-color: #60452e;
    }

    .content {
      display: flex;
      height: calc(100vh - 140px);
      min-height: 400px;
    }

    #placeList {
      width: 340px;
      flex-shrink: 0;
      overflow-y: auto;
      border-right: 1px solid #ddd;
      padding: 12px;
    }

    #map {
      flex: 1;
      min-width: 0;
    }

    .place-card {
      padding: 13px 8px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .place-card:hover {
      background: #fff8f0;
    }

    .place-card h3 {
      margin: 0 0 7px;
      font-size: 16px;
    }

    .place-card p {
      margin: 4px 0;
      font-size: 13px;
      line-height: 1.5;
      color: #666;
      overflow-wrap: anywhere;
    }

    .category {
      display: inline-block;
      margin-bottom: 6px;
      padding: 3px 7px;
      border-radius: 5px;
      background: #fff0dc;
      font-size: 12px;
    }

    #status {
      padding-top: 8px;
      font-size: 13px;
      color: #666;
    }

    .dog-marker {
      font-size: 30px;
      cursor: pointer;
      filter: drop-shadow(0 1px 2px #aaa);
    }

    .popup {
      min-width: 210px;
      max-width: 280px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .popup strong {
      font-size: 15px;
    }

    .popup a {
      color: #1769aa;
    }

    @media (max-width: 650px) {
      .content {
        flex-direction: column-reverse;
        height: calc(100vh - 155px);
      }

      #map {
        flex: 1;
        min-height: 250px;
      }

      #placeList {
        width: 100%;
        height: 40%;
        flex-shrink: 0;
        border-right: none;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>🐾 반려동물 동반 매장 찾기</h1>

    <div class="search-area">
      <select id="categorySelect">
        <option value="전체">전체</option>
        <option value="카페">카페</option>
        <option value="식당">음식점</option>
      </select>

      <input
        id="keywordInput"
        type="text"
        placeholder="매장명 검색 (선택)"
      >

      <button id="searchButton">검색</button>
      <button id="locationButton">내 위치</button>
    </div>

    <div id="status">지도와 매장 데이터를 불러오는 중...</div>
  </header>

  <main class="content">
    <section id="placeList">
      <p>검색 결과가 여기에 표시됩니다.</p>
    </section>
    <div id="map"></div>
  </main>

  <script>
    // GitHub 저장소에 index.html과 함께 올린 CSV 파일
    const CSV_FILE = "./places.csv";

    // 지도 중심에서 검색할 반경: 5km
    const SEARCH_RADIUS = 5000;

    // 한 번에 표시할 최대 매장 수
    const MAX_RESULTS = 50;

    let map;
    let allPlaces = [];
    let markers = [];
    let overlays = [];
    let activeInfoWindow = null;

    const statusElement = document.getElementById("status");
    const placeList = document.getElementById("placeList");

    // HTML에 표시할 텍스트를 안전하게 변환
    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, function(char) {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };

        return entities[char];
      });
    }

    // 두 좌표 사이의 거리 계산(m)
    function calculateDistance(lat1, lng1, lat2, lng2) {
      const earthRadius = 6371000;
      const radians = degree => degree * Math.PI / 180;

      const dLat = radians(lat2 - lat1);
      const dLng = radians(lng2 - lng1);

      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(radians(lat1)) *
        Math.cos(radians(lat2)) *
        Math.sin(dLng / 2) ** 2;

      return 2 * earthRadius *
        Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // 거리 표시
    function formatDistance(distance) {
      return distance < 1000
        ? `${Math.round(distance)}m`
        : `${(distance / 1000).toFixed(1)}km`;
    }

    // CSV 데이터를 불러와 카페와 식당만 저장
    function loadCSV() {
      statusElement.textContent = "매장 데이터를 불러오는 중...";

      Papa.parse(CSV_FILE, {
        download: true,
        header: true,
        skipEmptyLines: true,
        encoding: "UTF-8",

        complete: function(result) {
          if (!result.data || result.data.length === 0) {
            statusElement.textContent =
              "CSV 데이터가 비어 있어요. places.csv 파일을 확인해 주세요.";
            return;
          }

          const rows = result.data;

          allPlaces = rows
            .filter(place => {
              const category =
                String(place["카테고리3"] || "").trim();

              const petAllowed =
                String(place["반려동물 동반 가능정보"] || "")
                  .trim()
                  .toUpperCase();

              const lat = Number(place["위도"]);
              const lng = Number(place["경도"]);

              return (
                ["카페", "식당"].includes(category) &&
                petAllowed === "Y" &&
                String(place["시설명"] || "").trim() !== "" &&
                Number.isFinite(lat) &&
                Number.isFinite(lng) &&
                lat >= -90 && lat <= 90 &&
                lng >= -180 && lng <= 180
              );
            })
            .map(place => ({
              ...place,
              lat: Number(place["위도"]),
              lng: Number(place["경도"]),
              name: String(place["시설명"]).trim(),
              category: String(place["카테고리3"]).trim(),
              address: String(
                place["도로명주소"] ||
                place["지번주소"] ||
                "주소 정보 없음"
              ).trim()
            }));

          if (allPlaces.length === 0) {
            statusElement.textContent =
              "조건에 맞는 매장이 없어요. CSV의 열 이름을 확인해 주세요.";
            console.error("CSV 열 이름:", Object.keys(rows[0]));
            return;
          }

          statusElement.textContent =
            `반려동물 동반 가능 카페·식당 ${allPlaces.length}곳을 불러왔어요.`;

          searchPlaces();
        },

        error: function(error) {
          statusElement.textContent =
            "CSV를 불러오지 못했어요. GitHub에 places.csv가 올라갔는지 확인해 주세요.";
          console.error("CSV 오류:", error);
        }
      });
    }

    // 이전 검색 결과 지우기
    function clearResults() {
      markers.forEach(marker => marker.setMap(null));
      overlays.forEach(overlay => overlay.setMap(null));

      markers = [];
      overlays = [];

      if (activeInfoWindow) {
        activeInfoWindow.close();
        activeInfoWindow = null;
      }

      placeList.innerHTML = "";
    }

    // 현재 지도 중심 주변의 매장 검색
    function searchPlaces() {
      if (!map || allPlaces.length === 0) {
        return;
      }

      clearResults();

      const selectedCategory =
        document.getElementById("categorySelect").value;

      const keyword = document.getElementById("keywordInput")
        .value.trim().toLowerCase();

      const center = map.getCenter();
      const centerLat = center.getLat();
      const centerLng = center.getLng();

      const results = allPlaces
        .filter(place => {
          if (
            selectedCategory !== "전체" &&
            place.category !== selectedCategory
          ) {
            return false;
          }

          if (
            keyword &&
            !place.name.toLowerCase().includes(keyword)
          ) {
            return false;
          }

          return true;
        })
        .map(place => ({
          ...place,
          distance: calculateDistance(
            centerLat,
            centerLng,
            place.lat,
            place.lng
          )
        }))
        .filter(place => place.distance <= SEARCH_RADIUS)
        .sort((a, b) => a.distance - b.distance)
        .slice(0, MAX_RESULTS);

      if (results.length === 0) {
        placeList.innerHTML =
          "<p>주변에 조건에 맞는 매장이 없어요. 지도를 이동한 뒤 다시 검색해 보세요.</p>";

        statusElement.textContent =
          "반경 5km 내 검색 결과가 없습니다.";
        return;
      }

      results.forEach(place => {
        addPlaceMarker(place);
        addPlaceCard(place);
      });

      statusElement.textContent =
        `${results.length}곳을 찾았어요. 지도 중심 5km 내 결과이며 최대 50곳까지 표시합니다.`;
    }

    // 강아지 마커 추가
    function addPlaceMarker(place) {
      const position =
        new kakao.maps.LatLng(place.lat, place.lng);

      const markerElement = document.createElement("div");
      markerElement.className = "dog-marker";
      markerElement.textContent = "🐶";
      markerElement.title = place.name;

      const overlay = new kakao.maps.CustomOverlay({
        position: position,
        content: markerElement,
        yAnchor: 1
      });

      overlay.setMap(map);
      overlays.push(overlay);

      markerElement.addEventListener("click", function() {
        showPlaceInfo(place, position);
      });
    }

    // 왼쪽 매장 목록에 항목 추가
    function addPlaceCard(place) {
      const card = document.createElement("article");
      card.className = "place-card";

      card.innerHTML = `
        <span class="category">${escapeHTML(place.category)}</span>
        <h3>${escapeHTML(place.name)}</h3>
        <p>${escapeHTML(place.address)}</p>
        <p>지도 중심에서 ${formatDistance(place.distance)}</p>
        <p>🐾 데이터에 동반 가능으로 등록된 매장</p>
      `;

      card.addEventListener("click", function() {
        const position =
          new kakao.maps.LatLng(place.lat, place.lng);

        map.panTo(position);
        showPlaceInfo(place, position);
      });

      placeList.appendChild(card);
    }

    // 매장 상세 팝업 표시
    function showPlaceInfo(place, position) {
      if (activeInfoWindow) {
        activeInfoWindow.close();
      }

      const phone = String(place["전화번호"] || "").trim();
      const homepage = String(place["홈페이지"] || "").trim();

      const restrictions = String(
        place["반려동물 제한사항"] ||
        place["반려동물 동반 가능정보"] ||
        "정보 없음"
      ).trim();

      let homepageHTML = "";

      try {
        const url = new URL(homepage);

        if (["http:", "https:"].includes(url.protocol)) {
          homepageHTML =
            `<br><a href="${escapeHTML(url.href)}" target="_blank" rel="noopener noreferrer">홈페이지 방문</a>`;
        }
      } catch (error) {
        // 유효한 홈페이지 주소가 없으면 링크를 표시하지 않음
      }

      const content = `
        <div class="popup">
          <strong>${escapeHTML(place.name)}</strong><br>
          분류: ${escapeHTML(place.category)}<br>
          주소: ${escapeHTML(place.address)}<br>
          전화번호: ${escapeHTML(phone || "정보 없음")}<br>
          반려동물 정보: ${escapeHTML(restrictions)}
          ${homepageHTML}
        </div>
      `;

      activeInfoWindow = new kakao.maps.InfoWindow({
        content: content,
        removable: true
      });

      // 정보창을 표시하기 위한 투명 마커
      const anchorMarker = new kakao.maps.Marker({
        position: position,
        opacity: 0
      });

      anchorMarker.setMap(map);
      markers.push(anchorMarker);

      activeInfoWindow.open(map, anchorMarker);
    }

    // 현재 위치로 지도 이동
    function moveToMyLocation() {
      if (!navigator.geolocation) {
        statusElement.textContent =
          "현재 위치 기능을 지원하지 않는 브라우저예요.";
        return;
      }

      statusElement.textContent = "현재 위치를 확인하고 있어요...";

      navigator.geolocation.getCurrentPosition(
        function(position) {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          map.setCenter(new kakao.maps.LatLng(lat, lng));
          searchPlaces();
        },

        function(error) {
          statusElement.textContent =
            "위치 정보를 가져오지 못했어요. 브라우저 위치 권한을 확인해 주세요.";
        },

        {
          enableHighAccuracy: true,
          timeout: 10000
        }
      );
    }

    // 지도 초기화
    function initializeMap() {
      const container = document.getElementById("map");

      map = new kakao.maps.Map(container, {
        center: new kakao.maps.LatLng(37.5665, 126.9780),
        level: 5
      });

      document.getElementById("searchButton")
        .addEventListener("click", searchPlaces);

      document.getElementById("locationButton")
        .addEventListener("click", moveToMyLocation);

      document.getElementById("keywordInput")
        .addEventListener("keydown", function(event) {
          if (event.key === "Enter") {
            searchPlaces();
          }
        });

      // CSV 불러오기
      loadCSV();
    }

    // 카카오 지도 SDK 확인
    if (window.kakao && window.kakao.maps) {
      kakao.maps.load(initializeMap);
    } else {
      statusElement.textContent =
        "카카오 지도 SDK를 불러오지 못했어요. JavaScript 키와 Web 도메인을 확인해 주세요.";
    }
  </script>
</body>
</html>
