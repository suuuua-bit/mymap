
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>멍냥지도 | 반려동물 동반 장소 찾기</title>

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=41a46ce230457ef8074be30843244b99&libraries=services&autoload=false"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      background: #fffaf3;
      color: #514238;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .sidebar {
      width: 370px;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      background: #fffaf3;
      border-right: 2px solid #eadbc9;
      z-index: 2;
    }

    .header {
      padding: 25px 22px 18px;
      background: #f5e6d4;
    }

    .logo {
      font-size: 27px;
      font-weight: 900;
      color: #79553b;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 7px;
      font-size: 13px;
      color: #8d7562;
      line-height: 1.6;
    }

    .pet-decoration {
      margin-top: 10px;
      font-size: 23px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 15px 18px 5px;
    }

    .tab {
      flex: 1;
      padding: 12px 8px;
      border: 0;
      border-radius: 14px;
      background: #f1e6d9;
      color: #866d58;
      font-weight: 800;
    }

    .tab.active {
      background: #8b674b;
      color: white;
      box-shadow: 0 3px 7px #8b674b25;
    }

    .search-area {
      padding: 12px 18px 14px;
    }

    .search-label {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .search-row {
      display: flex;
      gap: 7px;
    }

    #searchInput {
      min-width: 0;
      flex: 1;
      padding: 13px 12px;
      border: 2px solid #e6d6c4;
      border-radius: 13px;
      outline: none;
      background: white;
      color: #514238;
    }

    #searchInput:focus {
      border-color: #a98461;
    }

    #searchButton {
      border: 0;
      border-radius: 13px;
      padding: 0 15px;
      background: #8b674b;
      color: white;
      font-weight: 800;
    }

    #locationButton {
      width: 100%;
      margin-top: 9px;
      padding: 10px;
      border: 1px solid #e5d3bf;
      border-radius: 12px;
      background: #fff;
      color: #79553b;
      font-weight: 700;
    }

    .hint {
      margin-top: 9px;
      font-size: 11px;
      line-height: 1.6;
      color: #9b8775;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      border-top: 1px solid #f0e4d7;
      border-bottom: 1px solid #f0e4d7;
      font-size: 13px;
      font-weight: 800;
    }

    #resultCount {
      color: #9b7553;
    }

    #placeList {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .place-card {
      padding: 15px;
      margin-bottom: 10px;
      border: 1px solid #eddfd0;
      border-radius: 16px;
      background: white;
      cursor: pointer;
      transition: 0.15s;
    }

    .place-card:hover {
      border-color: #b99674;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px #79553b10;
    }

    .place-name {
      font-size: 15px;
      font-weight: 900;
      line-height: 1.5;
      color: #604630;
    }

    .place-category {
      display: inline-block;
      margin: 7px 0;
      padding: 4px 8px;
      border-radius: 8px;
      background: #f8eee2;
      color: #956b47;
      font-size: 11px;
      font-weight: 800;
    }

    .place-address {
      font-size: 12px;
      line-height: 1.6;
      color: #89796c;
      overflow-wrap: anywhere;
    }

    .empty {
      padding: 32px 15px;
      text-align: center;
      color: #9a8878;
      font-size: 13px;
      line-height: 1.8;
    }

    .footer {
      padding: 10px;
      text-align: center;
      font-size: 11px;
      color: #a08c79;
      background: #f8eee2;
    }

    #map {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: #eee8de;
    }

    .info-window {
      padding: 12px;
      min-width: 190px;
      max-width: 250px;
      font-family: sans-serif;
      color: #514238;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .info-title {
      font-weight: 900;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .info-detail {
      font-size: 12px;
      color: #76695d;
    }

    @media (max-width: 700px) {
      .app {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        min-width: 0;
        height: 53%;
        flex: none;
        border-right: 0;
        border-bottom: 2px solid #eadbc9;
      }

      .header {
        padding: 13px 16px 10px;
      }

      .logo {
        font-size: 22px;
      }

      .pet-decoration {
        display: none;
      }

      .tabs {
        padding: 9px 12px 2px;
      }

      .search-area {
        padding: 8px 12px 10px;
      }

      .results-header {
        padding: 8px 14px;
      }

      #placeList {
        padding: 8px 10px;
      }

      .place-card {
        padding: 11px;
        margin-bottom: 7px;
      }

      .footer {
        display: none;
      }

      #map {
        width: 100%;
        min-height: 150px;
        flex: 1;
      }
    }
  </style>
</head>

<body>
<div class="app">
  <aside class="sidebar">
    <header class="header">
      <div class="logo">🐾 멍냥지도</div>
      <div class="subtitle">
        우리 아이와 함께하는 즐거운 외출!<br>
        반려동물 동반 장소를 찾아보세요.
      </div>
      <div class="pet-decoration">🐶 🐱 🐾</div>
    </header>

    <div class="tabs">
      <button class="tab active" data-category="카페">☕ 카페</button>
      <button class="tab" data-category="식당">🍽️ 음식점</button>
    </div>

    <section class="search-area">
      <div class="search-label">🔎 어디로 가고 싶나요?</div>
      <div class="search-row">
        <input
          id="searchInput"
          type="search"
          placeholder="초밥, 파스타, 고기, 카페..."
          autocomplete="off"
        >
        <button id="searchButton">검색</button>
      </div>
      <button id="locationButton">📍 내 위치로 이동</button>
      <div class="hint">
        음식점 탭에서 파스타·초밥·고기 등을 검색해 보세요!<br>
        검색 결과는 등록된 반려동물 동반 장소 데이터에 한해 표시돼요.
      </div>
    </section>

    <div class="results-header">
      <span>🐾 검색 결과</span>
      <span id="resultCount">불러오는 중...</span>
    </div>

    <div id="placeList">
      <div class="empty">장소 데이터를 불러오고 있어요... 🐾</div>
    </div>

    <div class="footer">멍냥지도 · 반려동물과 함께하는 하루 🧡</div>
  </aside>

  <main id="map"></main>
</div>

<script>
  // CSV 파일은 index.html과 같은 폴더에 있어야 합니다.
  const CSV_FILE = "./places.csv";

  const DEFAULT_RADIUS = 5000;
  const MAX_RESULTS = 100;

  let map;
  let places = [];
  let markers = [];
  let infoWindow;
  let selectedCategory = "카페";
  let userLocation = null;
  let currentResults = [];

  // 음식 이름과 비슷한 표현을 연결합니다.
  const FOOD_KEYWORDS = {
    "파스타": ["파스타", "스파게티", "이탈리안", "양식"],
    "스파게티": ["파스타", "스파게티", "이탈리안"],
    "고기": ["고기", "삼겹살", "소고기", "돼지고기", "갈비", "스테이크", "정육"],
    "삼겹살": ["삼겹살", "고기", "돼지고기", "구이"],
    "소고기": ["소고기", "한우", "스테이크", "갈비"],
    "돼지고기": ["돼지고기", "삼겹살", "목살", "고기"],
    "스테이크": ["스테이크", "소고기", "양식", "고기"],
    "초밥": ["초밥", "스시", "일식"],
    "스시": ["초밥", "스시", "일식"],
    "회": ["회", "초밥", "스시", "횟집"],
    "일식": ["일식", "초밥", "스시", "돈카츠", "우동", "라멘"],
    "피자": ["피자", "화덕피자", "이탈리안"],
    "치킨": ["치킨", "닭강정", "닭갈비", "닭요리"],
    "햄버거": ["햄버거", "버거", "수제버거"],
    "버거": ["햄버거", "버거", "수제버거"],
    "국밥": ["국밥", "순대국", "돼지국밥", "해장국"],
    "떡볶이": ["떡볶이", "분식", "라볶이"],
    "분식": ["분식", "떡볶이", "김밥", "라볶이"],
    "김밥": ["김밥", "분식"],
    "돈까스": ["돈까스", "돈카츠", "일식"],
    "돈카츠": ["돈까스", "돈카츠", "일식"],
    "라멘": ["라멘", "라면", "일식"],
    "우동": ["우동", "일식"],
    "마라탕": ["마라탕", "마라", "중식"],
    "중식": ["중식", "짜장면", "짬뽕", "탕수육", "마라탕"],
    "짜장면": ["짜장면", "중식", "중화요리"],
    "짬뽕": ["짬뽕", "중식", "중화요리"],
    "쌀국수": ["쌀국수", "베트남 음식", "베트남"],
    "샐러드": ["샐러드", "샐러드바"],
    "브런치": ["브런치", "양식", "파니니"],
    "디저트": ["디저트", "케이크", "마카롱", "베이커리"],
    "케이크": ["케이크", "디저트", "베이커리"],
    "빵": ["빵", "베이커리", "빵집"],
    "아이스크림": ["아이스크림", "젤라또", "디저트"],
    "커피": ["커피", "카페", "로스터리"],
    "카페": ["카페", "커피", "디저트", "베이커리"]
  };

  function normalize(value) {
    return String(value ?? "")
      .toLowerCase()
      .replace(/\s+/g, "")
      .trim();
  }

  function getField(row, candidates) {
    const keys = Object.keys(row || {});
    for (const candidate of candidates) {
      const found = keys.find(
        key => normalize(key) === normalize(candidate)
      );
      if (found && row[found] != null) {
        return String(row[found]).trim();
      }
    }
    return "";
  }

  function expandKeyword(keyword) {
    const raw = keyword.trim().toLowerCase();
    const compact = normalize(raw);
    const expanded = new Set([raw, compact]);

    for (const [key, values] of Object.entries(FOOD_KEYWORDS)) {
      if (normalize(key) === compact) {
        values.forEach(value => {
          expanded.add(value.toLowerCase());
          expanded.add(normalize(value));
        });
      }
    }

    return [...expanded].filter(Boolean);
  }

  function isPetAllowed(row) {
    const value = getField(row, [
      "반려동물 동반 가능정보",
      "반려동물동반가능정보",
      "반려동물 동반 가능",
      "동반 가능 여부"
    ]).toLowerCase();

    return ["y", "yes", "가능", "가능함", "true"].includes(value);
  }

  function toPlace(row, index) {
    const name = getField(row, ["시설명", "업소명", "장소명", "매장명", "상호명", "name"]);
    const category = getField(row, ["카테고리3", "업종", "업태명", "카테고리", "category"]);
    const lat = Number(getField(row, ["위도", "lat", "latitude"]));
    const lng = Number(getField(row, ["경도", "lon", "lng", "longitude"]));

    return {
      id: index,
      name,
      category,
      lat,
      lng,
      roadAddress: getField(row, ["도로명주소", "도로명 주소", "roadAddress"]),
      address: getField(row, ["지번주소", "지번 주소", "주소", "address"]),
      phone: getField(row, ["전화번호", "연락처", "전화"]),
      petInfo: getField(row, ["반려동물 동반 가능정보", "반려동물 동반 가능"]),
      petRestrictions: getField(row, ["반려동물 제한사항", "반려동물 제한 사항", "제한사항"]),
      homepage: getField(row, ["홈페이지", "홈페이지 주소", "url"]),
      raw: row
    };
  }

  function getPlaceSearchText(place) {
    // 홈페이지 주소는 검색 대상에서 제외합니다.
    return normalize([
      place.name,
      place.category,
      place.roadAddress,
      place.address,
      place.phone,
      place.petInfo,
      place.petRestrictions
    ].join(" "));
  }

  function getDistance(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const toRad = value => value * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);

    const a =
      Math.sin(dLat / 2) ** 2 +
      Math.cos(toRad(lat1)) *
      Math.cos(toRad(lat2)) *
      Math.sin(dLng / 2) ** 2;

    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function initMap() {
    const container = document.getElementById("map");

    map = new kakao.maps.Map(container, {
      center: new kakao.maps.LatLng(37.5665, 126.9780),
      level: 7
    });

    infoWindow = new kakao.maps.InfoWindow({ zIndex: 10 });

    loadCSV();
  }

  function loadCSV() {
    Papa.parse(CSV_FILE, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        if (results.errors && results.errors.length) {
          console.warn("CSV 읽기 경고:", results.errors);
        }

        places = results.data
          .map(toPlace)
          .filter(place =>
            place.name &&
            Number.isFinite(place.lat) &&
            Number.isFinite(place.lng) &&
            place.lat !== 0 &&
            place.lng !== 0 &&
            isPetAllowed(place.raw)
          );

        if (places.length === 0) {
          document.getElementById("placeList").innerHTML =
            '<div class="empty">장소 데이터가 없어요.<br>CSV의 열 이름과 동반 가능 정보(Y)를 확인해 주세요.</div>';
          document.getElementById("resultCount").textContent = "0곳";
          return;
        }

        renderResults();
      },
      error: function(error) {
        console.error(error);
        document.getElementById("placeList").innerHTML =
          '<div class="empty">CSV 파일을 불러오지 못했어요.<br>index.html과 places.csv가 같은 폴더에 있는지 확인해 주세요.</div>';
        document.getElementById("resultCount").textContent = "오류";
      }
    });
  }

  function matchesCategory(place) {
    const category = normalize(place.category);

    if (selectedCategory === "카페") {
      return category.includes("카페") || category.includes("커피");
    }

    return (
      category.includes("식당") ||
      category.includes("음식") ||
      category.includes("레스토랑") ||
      category.includes("한식") ||
      category.includes("중식") ||
      category.includes("일식") ||
      category.includes("양식") ||
      category.includes("분식") ||
      category.includes("패스트푸드") ||
      category.includes("패밀리레스토랑") ||
      category.includes("패스트푸드점") ||
      category.includes("제과") ||
      category.includes("치킨") ||
      category.includes("피자") ||
      category.includes("햄버거") ||
      category.includes("고기") ||
      category.includes("횟집") ||
      category.includes("초밥") ||
      category.includes("국수") ||
      category.includes("구이") ||
      category.includes("탕") ||
      category.includes("찜") ||
      category.includes("뷔페") ||
      category.includes("돈까스") ||
      category.includes("족발") ||
      category.includes("보쌈") ||
      category.includes("샤브") ||
      category.includes("국밥") ||
      category.includes("마라") ||
      category.includes("쌀국수") ||
      category.includes("분류") ||
      category.includes("식품접객업")
    );
  }

  function matchesSearch(place, query) {
    if (!query) return true;

    const words = query.trim().split(/\s+/).filter(Boolean);
    const searchText = getPlaceSearchText(place);

    // 입력한 모든 단어가 매장 정보에 있으면 결과로 표시합니다.
    // 음식명은 동의어로 확장해서 검색합니다.
    return words.every(word => {
      const candidates = expandKeyword(word);
      return candidates.some(candidate =>
        searchText.includes(normalize(candidate))
      );
    });
  }

  function renderResults() {
    const query = document.getElementById("searchInput").value.trim();

    const center = map.getCenter();
    const centerLat = center.getLat();
    const centerLng = center.getLng();

    const results = places
      .filter(matchesCategory)
      .filter(place => matchesSearch(place, query))
      .map(place => ({
        ...place,
        distance: getDistance(centerLat, centerLng, place.lat, place.lng)
      }))
      .filter(place => place.distance <= DEFAULT_RADIUS)
      .sort((a, b) => a.distance - b.distance)
      .slice(0, MAX_RESULTS);

    currentResults = results;
    renderList(results);
    renderMarkers(results);
  }

  function renderList(results) {
    const list = document.getElementById("placeList");
    document.getElementById("resultCount").textContent = results.length + "곳";

    if (results.length === 0) {
      list.innerHTML = `
        <div class="empty">
          🐾 검색 결과가 없어요!<br><br>
          다른 음식 이름을 입력하거나<br>
          지도를 원하는 지역으로 이동해 보세요.<br><br>
          <b>참고:</b> 음식 메뉴가 CSV에 등록되지 않은 매장은<br>
          검색되지 않을 수 있어요.
        </div>`;
      return;
    }

    list.innerHTML = "";

    results.forEach(place => {
      const card = document.createElement("div");
      card.className = "place-card";

      const name = document.createElement("div");
      name.className = "place-name";
      name.textContent = (selectedCategory === "카페" ? "☕ " : "🍽️ ") + place.name;

      const category = document.createElement("span");
      category.className = "place-category";
      category.textContent = place.category || selectedCategory;

      const address = document.createElement("div");
      address.className = "place-address";
      address.textContent =
        "📍 " + (place.roadAddress || place.address || "주소 정보 없음");

      card.append(name, category, address);

      card.addEventListener("click", () => {
        const position = new kakao.maps.LatLng(place.lat, place.lng);
        map.panTo(position);
        map.setLevel(3);
        showPlaceInfo(place);
      });

      list.appendChild(card);
    });
  }

  function clearMarkers() {
    markers.forEach(marker => marker.setMap(null));
    markers = [];
    infoWindow.close();
  }

  function renderMarkers(results) {
    clearMarkers();

    results.forEach(place => {
      const marker = new kakao.maps.Marker({
        map,
        position: new kakao.maps.LatLng(place.lat, place.lng),
        title: place.name
      });

      kakao.maps.event.addListener(marker, "click", () => {
        showPlaceInfo(place);
      });

      markers.push(marker);
    });
  }

  function showPlaceInfo(place) {
    const content = document.createElement("div");
    content.className = "info-window";

    const title = document.createElement("div");
    title.className = "info-title";
    title.textContent = place.name;

    const category = document.createElement("div");
    category.className = "info-detail";
    category.textContent = place.category || selectedCategory;

    const address = document.createElement("div");
    address.className = "info-detail";
    address.textContent = "📍 " + (place.roadAddress || place.address || "주소 정보 없음");

    content.append(title, category, address);

    if (place.phone) {
      const phone = document.createElement("div");
      phone.className = "info-detail";
      phone.textContent = "☎ " + place.phone;
      content.appendChild(phone);
    }

    const pet = document.createElement("div");
    pet.className = "info-detail";
    pet.textContent = "🐾 반려동물 동반 가능 정보 등록";
    content.appendChild(pet);

    infoWindow.setContent(content);
    infoWindow.open(map, markers.find(marker =>
      marker.getTitle() === place.name
    ));
  }

  document.querySelectorAll(".tab").forEach(button => {
    button.addEventListener("click", () => {
      selectedCategory = button.dataset.category;

      document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.toggle("active", tab === button);
      });

      renderResults();
    });
  });

  document.getElementById("searchButton").addEventListener("click", renderResults);

  document.getElementById("searchInput").addEventListener("keydown", event => {
    if (event.key === "Enter") renderResults();
  });

  // 검색어 입력 중에도 결과를 갱신합니다.
  document.getElementById("searchInput").addEventListener("input", () => {
    renderResults();
  });

  document.getElementById("locationButton").addEventListener("click", () => {
    if (!navigator.geolocation) {
      alert("이 브라우저에서는 위치 기능을 사용할 수 없어요.");
      return;
    }

    navigator.geolocation.getCurrentPosition(
      position => {
        userLocation = {
          lat: position.coords.latitude,
          lng: position.coords.longitude
        };

        const center = new kakao.maps.LatLng(userLocation.lat, userLocation.lng);
        map.setCenter(center);
        map.setLevel(5);
        renderResults();
      },
      () => {
        alert("위치를 가져오지 못했어요. 브라우저의 위치 권한을 확인해 주세요.");
      }
    );
  });

  kakao.maps.load(initMap);
</script>
</body>
</html>
